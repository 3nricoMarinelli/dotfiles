## Bindings

unbind C-b
set -g prefix `
bind ` send-prefix
unbind r
bind r source-file ~/.tmux.conf


bind Up     select-pane -U
bind Left   select-pane -L
bind Down   select-pane -D
bind Right  select-pane -R

bind S-Up    select-pane -U \; resize-pane -Z
bind S-Left  select-pane -L \; resize-pane -Z
bind S-Down  select-pane -D \; resize-pane -Z
bind S-Right select-pane -R \; resize-pane -Z

bind h  split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind v  split-window -v -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"

bind H  split-window -h -c "#{pane_current_path}" \; resize-pane -Z
bind |  split-window -h -c "#{pane_current_path}" \; resize-pane -Z
bind V  split-window -v -c "#{pane_current_path}" \; resize-pane -Z
bind _  split-window -v -c "#{pane_current_path}" \; resize-pane -Z

bind c new-window -c "#{pane_current_path}"
bind n new-session -c "#{pane_current_path}"

bind C new-window -c "$HOME"
bind N new-session -c "$HOME"

bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

bind f resize-pane -Z
bind q detach-client
bind e choose-window -Z

bind C-a last-window

bind-key < swap-window -t -1
bind-key > swap-window -t +1

set -g focus-events on

# prefix + l: clear shell + wipe tmux scrollback (non-intercepting alternative to Cmd+K)
bind l send-keys C-l \; run-shell "sleep 0.1" \; clear-history

# scroll dirtectly entering in copy mode
# Alt+Up enters copy mode and scrolls up immediately
bind -n C-M-Up copy-mode \; send-keys -X page-up
bind -n C-M-Down copy-mode \; send-keys -X page-down

# Alt+arrows work inside copy mode too
bind -T copy-mode C-M-Up   send-keys -X page-up
bind -T copy-mode C-M-Down send-keys -X page-down


## Options

set-option -g set-clipboard external
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window
set -g allow-passthrough on  # required for image.nvim
set -g extended-keys on

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g default-terminal "${TERM}"
setw -g mode-keys vi

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'


## Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @override_copy_command 'xclip -i -selection clipboard >/dev/null'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @continuum-restore 'on'

# Save and restore sessions
# set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-save 'S'
# set -g @resurrect-restore 'R'


## Theme (linked with Neovim)

set -g status-position bottom

run '~/.tmux/plugins/tpm/tpm'

# Auto-synced Neovim theme palette
if-shell 'test -f ~/.local/state/tmux/current_theme.conf' \
  'source-file ~/.local/state/tmux/current_theme.conf'
